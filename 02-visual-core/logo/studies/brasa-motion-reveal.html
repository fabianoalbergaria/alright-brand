  :root {
    --bone:        #faf9f5;
    --dark:        #141413;
    --kodak-red:   #ed1c24;
    --slate-warm:  #5b5750;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--dark);
    color: var(--bone);
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100%;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  .stage {
    position: relative;
    width: min(92vw, 720px);
    aspect-ratio: 4 / 5;
  }
  canvas {
    width: 100%; height: 100%;
    display: block;
  }
  .wordmark {
    position: absolute;
    left: 50%;
    /* the brasa sits at ~72% from top; place wordmark at ~84% */
    top: 84%;
    transform: translate(-50%, -50%);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 6.8vw, 70px);
    letter-spacing: -0.005em;
    color: var(--bone);
    opacity: 0;
    transition: opacity 1.4s cubic-bezier(0.16, 1.0, 0.3, 1.0);
    pointer-events: none;
    white-space: nowrap;
  }
  .wordmark.visible { opacity: 1; }
  /* The central l keeps its structural Bold 700 even in monochrome —
     the Alright logo's signature, just no Kodak Red accent here.
     Reveal moment is cinematic monochrome by design. */
  .wordmark b { font-weight: 700; font-style: normal; }
  .controls {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 18px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .8s ease;
  }
  .controls.visible { opacity: 0.85; }
  button.cta {
    appearance: none;
    background: transparent;
    color: var(--bone);
    border: 1px solid rgba(250,249,245,0.4);
    padding: 10px 22px;
    border-radius: 999px;
    font: inherit;
    cursor: pointer;
    letter-spacing: 0.12em;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  button.cta:hover { background: rgba(250,249,245,0.08); border-color: var(--bone); }
  .meta {
    position: absolute;
    top: 18px; left: 22px; right: 22px;
    display: flex; justify-content: space-between;
    font-size: 11px;
    color: var(--slate-warm);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .start-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--dark);
    cursor: pointer;
    transition: opacity .5s ease;
    z-index: 10;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-overlay .label {
    border: 1px solid rgba(250,249,245,0.5);
    color: var(--bone);
    padding: 16px 32px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .start-overlay .hint {
    position: absolute;
    bottom: 28px; left: 0; right: 0;
    text-align: center;
    color: var(--slate-warm);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
</style>
</head>

  <canvas id="c"></canvas>
  <div class="wordmark" id="wordmark">A<b>l</b>right</div>
  <div class="meta">

    <span>(( Brasa · reveal ))</span>
  </div>
  <div class="controls" id="controls">
    <button class="cta" id="replay">Replay</button>
  </div>
  <div class="start-overlay" id="start">
    <div class="label">Feel Alright</div>
    <div class="hint">som habilitado · clique para começar</div>
  </div>

<script>
(() => {
  const canvas   = document.getElementById('c');
  const ctx      = canvas.getContext('2d');
  const start    = document.getElementById('start');
  const controls = document.getElementById('controls');
  const replay   = document.getElementById('replay');
  const audio    = document.getElementById('audio');
  const wordmark = document.getElementById('wordmark');

  const COLORS = {
    bg:    '#141413',
    ember: '#ed1c24',
    smoke: '#faf9f5',
  };

  const LOGICAL_W = 600;
  const LOGICAL_H = 750;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const sx = canvas.width  / LOGICAL_W;
    const sy = canvas.height / LOGICAL_H;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Geometry (Brasa V01) ----------
  const cx     = LOGICAL_W / 2;
  const cyTile = LOGICAL_H * 0.50;
  const ey     = cyTile + 165;

  // ---------- Timing ----------
  const IGNITE_AT       = 0.28;
  const IGNITE_DURATION = 0.22;
  const WISP_BASE       = 0.62;
  const WISP_STAGGER    = 0.20;

  const wisps = [
    {
      p0: [cx,         ey - 12],
      p1: [cx -  68,   cyTile + 30],
      p2: [cx +  60,   cyTile - 68],
      p3: [cx +  22,   cyTile - 195],
      baseW: 8.5, tipW: 0.8,
      start: WISP_BASE + 0 * WISP_STAGGER, duration: 2.20,
    },
    {
      p0: [cx,         ey - 12],
      p1: [cx +  60,   cyTile + 22],
      p2: [cx -  60,   cyTile - 52],
      p3: [cx -  75,   cyTile - 150],
      baseW: 7,   tipW: 0.8,
      start: WISP_BASE + 1 * WISP_STAGGER, duration: 2.00,
    },
    {
      p0: [cx,         ey - 12],
      p1: [cx +  22,   cyTile + 45],
      p2: [cx +  82,   cyTile - 22],
      p3: [cx +  82,   cyTile - 120],
      baseW: 5.5, tipW: 0.8,
      start: WISP_BASE + 2 * WISP_STAGGER, duration: 1.80,
    },
  ];

  // After the last wisp finishes, hold a beat then fade in the wordmark.
  const WISP_FINISH = Math.max(...wisps.map(w => w.start + w.duration));
  const REVEAL_AT   = WISP_FINISH + 0.18;  // ~3.0s

  function bezierPoint(p0, p1, p2, p3, t) {
    const omt = 1 - t;
    const x = omt*omt*omt*p0[0] + 3*omt*omt*t*p1[0] + 3*omt*t*t*p2[0] + t*t*t*p3[0];
    const y = omt*omt*omt*p0[1] + 3*omt*omt*t*p1[1] + 3*omt*t*t*p2[1] + t*t*t*p3[1];
    return [x, y];
  }

  function drawWisp(w, progress) {
    const samples = 220;
    const end = Math.floor(samples * progress);
    if (end <= 0) return;
    ctx.fillStyle = COLORS.smoke;
    for (let i = 0; i < end; i++) {
      const t = i / (samples - 1);
      const [x, y] = bezierPoint(w.p0, w.p1, w.p2, w.p3, t);
      const width = w.baseW + (w.tipW - w.baseW) * t;
      const r = Math.max(0.25, width / 2);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let started = false;
  let revealed = false;
  let doneNotified = false;

  function render() {
    const t = started ? audio.currentTime : 0;

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (t >= IGNITE_AT) {
      const e = Math.min(1, (t - IGNITE_AT) / IGNITE_DURATION);
      const eased = 1 - Math.pow(1 - e, 3);
      const burnT = Math.max(0, Math.min(1, (t - 0.30) / 4.55));
      const burnGlow = Math.sin(burnT * Math.PI);
      const baseR = 14 + burnGlow * 3.5;
      const flick = t > IGNITE_AT + 0.35
        ? 1 + 0.05 * Math.sin((t - IGNITE_AT) * 11)
        : 1;
      const haloR = baseR * eased * (1.9 + burnGlow * 0.6);
      const haloAlpha = 0.30 + burnGlow * 0.16;
      const grad = ctx.createRadialGradient(cx, ey, baseR * eased * 0.7,
                                            cx, ey, haloR);
      grad.addColorStop(0, `rgba(237,28,36,${haloAlpha})`);
      grad.addColorStop(1, 'rgba(237,28,36,0.00)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, ey, haloR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.ember;
      ctx.beginPath();
      ctx.arc(cx, ey, baseR * eased * flick, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const w of wisps) {
      if (t >= w.start) {
        const p = Math.min(1, (t - w.start) / w.duration);
        const eased = 1 - Math.pow(1 - p, 2);
        drawWisp(w, eased);
      }
    }

    if (!revealed && t >= REVEAL_AT) {
      wordmark.classList.add('visible');
      revealed = true;
    }

    if (t > REVEAL_AT + 1.6) controls.classList.add("visible");

    // Notifica o parent (overlay) que a reveal completou — usado pelo
    // portfolio pra fade-out automaticamente. Apenas uma vez por play.
    if (!doneNotified && t > REVEAL_AT + 3.0 && window.parent !== window) {
      try { window.parent.postMessage({ type: "feel-alright-done" }, "*"); } catch(e){}
      doneNotified = true;
    }


    requestAnimationFrame(render);
  }

  function begin() {
    controls.classList.remove('visible');
    wordmark.classList.remove('visible');
    revealed = false;
    doneNotified = false;
    audio.currentTime = 0;
    audio.play().catch(() => {});
    started = true;
  }

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  requestAnimationFrame(render);

  start.addEventListener('click', () => {
    start.classList.add('hidden');
    begin();
  });
  replay.addEventListener('click', begin);
})();
</script>
