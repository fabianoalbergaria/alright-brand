<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <radialGradient id="brasa-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ed1c24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ed1c24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ed1c24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="320" fill="#faf9f5"/>
  
    <!-- Halo: the brand's single permitted gradient — radial, functional, anchored to ember -->
    <ellipse cx="120" cy="220" rx="98" ry="84" fill="url(#brasa-halo)" />

    <!-- Smoke wisps — three drawn paths in foreground color -->
    <g stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.62">
      <path d="M 120 208 C 115 168, 128 128, 118 88 C 115 70, 122 56, 118 44"/>
      <path d="M 100 211 C 92 175, 105 140, 92 102 C 88 82, 95 64, 88 56"/>
      <path d="M 140 211 C 148 175, 135 140, 148 102 C 152 82, 145 64, 152 56"/>
    </g>

    <!-- Ember — the hot dot, always Kodak Red -->
    <circle cx="120" cy="220" r="9" fill="#ed1c24" />
  
</svg>
